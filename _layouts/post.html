<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Harminder's Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="/" class="text-2xl font-bold text-blue-600">Harminder's Portfolio</a>
                <div class="space-x-6">
                    <a href="/#services" class="text-gray-700 hover:text-blue-600">Services</a>
                    <a href="/#projects" class="text-gray-700 hover:text-blue-600">Projects</a>
                    <a href="/#expertise" class="text-gray-700 hover:text-blue-600">Expertise</a>
                    <a href="/blog.html" class="text-gray-700 hover:text-blue-600">Articles</a>
                    <a href="/#contact" class="text-gray-700 hover:text-blue-600">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <article class="container mx-auto px-4 py-12">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <header class="mb-8">
                <h1 class="text-4xl font-bold mb-4">{{ page.title }}</h1>
                <div class="text-gray-600">
                    <span>{{ page.date | date: "%B %d, %Y" }}</span>
                    <span class="mx-2">•</span>
                    <span>{{ page.reading_time }} min read</span>
                </div>
            </header>

            <div class="prose prose-lg max-w-none">
                {{ content }}
            </div>

            <footer class="mt-8 pt-8 border-t border-gray-200">
                <a href="/blog.html" class="text-blue-600 hover:text-blue-800">← Back to Articles</a>
            </footer>
        </div>
    </article>

    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 Harminder's Portfolio. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
