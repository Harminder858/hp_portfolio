---
layout: default
title: Blog - Data Science Insights
---

<div class="container mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold mb-8 text-center">Data Science Insights & Articles</h1>
    
    <div class="max-w-4xl mx-auto">
        {% for post in site.posts %}
        <article class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-2xl font-bold mb-2">
                <a href="{{ post.url }}" class="text-blue-600 hover:text-blue-800">
                    {{ post.title }}
                </a>
            </h2>
            <p class="text-gray-600 text-sm mb-3">
                {{ post.date | date: "%B %d, %Y" }} • {{ post.reading_time }} min read
            </p>
            <p class="text-gray-700 mb-4">{{ post.excerpt }}</p>
            <a href="{{ post.url }}" class="text-blue-600 hover:text-blue-800 font-semibold">
                Read More →
            </a>
        </article>
        {% endfor %}
    </div>
</div>
