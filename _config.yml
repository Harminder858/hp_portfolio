title: Harminder Puri - Data Science & ML Solutions
description: Data Science and Machine Learning Expert Portfolio
baseurl: ""
url: "https://harminder858.github.io/hp_portfolio"

# Build settings
markdown: kramdown
theme: minima

# Include articles directory
include:
  - articles

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Harminder Puri"
  - scope:
      path: "articles"
    values:
      layout: "default"
      author: "Harminder Puri"